name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Run source tests
        run: python -m unittest discover -s tests

      - name: Build package
        run: |
          cd "$RUNNER_TEMP"
          python -m build "$GITHUB_WORKSPACE" --outdir "$GITHUB_WORKSPACE/dist"

      - name: Install built wheel
        run: |
          python -m pip install --force-reinstall "$GITHUB_WORKSPACE"/dist/*.whl
          python -m pip check

      - name: Smoke test installed package
        run: |
          cd "$RUNNER_TEMP"
          MNEMO_REPO_ROOT="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/tests/package_install_smoke.py"
