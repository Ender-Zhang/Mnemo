[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo"
version = "0.1.0"
description = "Personal AI runtime with durable chat, memory, skills, tools, and harnesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
feishu = [
  "lark-oapi>=1.4.8",
  "qrcode>=7.4",
]

[project.scripts]
mnemo = "mnemo.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemo*"]
exclude = ["tests*", "design*"]

[tool.setuptools.package-data]
"mnemo.interfaces" = ["web_assets/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
