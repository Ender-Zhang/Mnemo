[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo"
version = "0.1.0"
description = "Personal AI operating system runtime foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mnemo = "mnemo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
