[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-memory"
version = "0.1.0"
description = "Memory-only service for agent recall, candidate-first learning, and maintenance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mnemo-memory = "mnemo_memory.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mnemo_memory*"]
exclude = ["tests*", "design*"]

[tool.setuptools.package-data]
mnemo_memory = [
  "interfaces/web_assets/index.html",
  "interfaces/web_assets/assets/*",
  "eval/golden.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
