<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mnemo</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Mnemo</h1>
          <p id="status">Ready</p>
        </div>
        <div class="topbar-actions">
          <button id="settingsOpen" type="button" title="Settings">Settings</button>
          <button id="reset" type="button" title="New conversation">New</button>
        </div>
      </header>
      <section id="timeline" class="timeline" aria-live="polite"></section>
      <form id="composer" class="composer">
        <textarea id="message" name="message" rows="1" placeholder="Tell Mnemo what to do"></textarea>
        <button id="stop" class="stop" type="button" title="Stop current run" hidden>Stop</button>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <div id="settingsOverlay" class="settings-overlay" hidden>
      <aside class="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="settings-header">
          <div>
            <h2 id="settingsTitle">Settings</h2>
            <p id="settingsStatus">Ready</p>
          </div>
          <button id="settingsClose" type="button" title="Close settings">Close</button>
        </header>
        <div id="settingsContent" class="settings-content"></div>
      </aside>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
