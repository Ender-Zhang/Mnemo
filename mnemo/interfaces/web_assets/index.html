<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mnemo</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <nav class="rail" aria-label="Mnemo">
        <div class="rail-brand">
          <div class="rail-mark" aria-label="Mnemo">M</div>
          <span>Mnemo</span>
        </div>
        <button class="rail-button active" type="button" title="Chat" aria-label="Chat">
          <span class="rail-icon">C</span><span>Chat</span>
        </button>
        <button id="activityToggle" class="rail-button" type="button" title="Activity" aria-label="Activity">
          <span class="rail-icon">A</span><span>Activity</span>
        </button>
        <button id="settingsOpen" class="rail-button" type="button" title="Settings" aria-label="Settings">
          <span class="rail-icon">S</span><span>Settings</span>
        </button>
      </nav>

      <section class="chat-shell">
        <header class="topbar">
          <div class="topbar-copy">
            <h1>Mnemo OS</h1>
            <p>Everything starts here</p>
          </div>
          <div class="topbar-actions">
            <span id="status" class="status-pill">Ready</span>
            <span id="runBadge" class="run-badge">Idle</span>
            <button id="reset" class="ghost-button" type="button" title="New conversation">New</button>
          </div>
        </header>

        <section id="timeline" class="timeline" aria-live="polite"></section>

        <form id="composer" class="composer">
          <div class="composer-tools" aria-label="Composer tools">
            <button id="attachButton" class="icon-button" type="button" title="Attach file" aria-label="Attach file">+</button>
            <button id="voiceButton" class="icon-button" type="button" title="Voice input" aria-label="Voice input">mic</button>
            <button id="mentionButton" class="icon-button" type="button" title="Mention app" aria-label="Mention app">@</button>
          </div>
          <textarea id="message" name="message" rows="1" placeholder="今天想完成什么？"></textarea>
          <div class="composer-actions">
            <button id="stop" class="stop" type="button" title="Stop current run" hidden>Stop</button>
            <button id="send" class="send-button" type="submit" title="Send">Send</button>
          </div>
        </form>
      </section>

      <aside id="activityPanel" class="activity-panel" aria-label="Context and activity">
        <section class="context-panel" aria-label="User context">
          <header class="context-header">
            <div>
              <h2>User Context</h2>
              <p>Session continuity</p>
            </div>
            <span class="live-dot">Live</span>
          </header>
          <div class="context-grid">
            <div class="context-card">
              <span class="context-label">Recent ask</span>
              <strong id="contextUserPrompt">No recent prompt</strong>
            </div>
            <div class="context-card">
              <span class="context-label">Conversation</span>
              <strong id="contextConversation">new</strong>
            </div>
            <div class="context-card">
              <span class="context-label">Mission</span>
              <strong id="contextMission">new</strong>
            </div>
            <div class="context-card">
              <span class="context-label">Last run</span>
              <strong id="contextRun">none</strong>
            </div>
          </div>
        </section>
        <header class="activity-header">
          <div>
            <h2>Activity</h2>
            <p>Current run</p>
          </div>
          <span id="activityCount" class="activity-count">0</span>
        </header>
        <div id="activityList" class="activity-list"></div>
      </aside>
    </main>
    <div id="settingsOverlay" class="settings-overlay" hidden>
      <aside class="settings-drawer" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <header class="settings-header">
          <div>
            <h2 id="settingsTitle">Settings</h2>
            <p id="settingsStatus">Ready</p>
          </div>
          <button id="settingsClose" type="button" title="Close settings">Close</button>
        </header>
        <div id="settingsContent" class="settings-content"></div>
      </aside>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
