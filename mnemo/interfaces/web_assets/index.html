<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mnemo</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1>Mnemo</h1>
          <p id="status">Ready</p>
        </div>
        <button id="reset" type="button" title="New conversation">New</button>
      </header>
      <section id="timeline" class="timeline" aria-live="polite"></section>
      <form id="composer" class="composer">
        <textarea id="message" name="message" rows="1" placeholder="Tell Mnemo what to do"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
